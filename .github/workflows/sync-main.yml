name: Sync main from Codeberg

on:
  schedule:
    - cron: "35 5 * * *"
      timezone: "America/Chicago"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: sync-main-from-codeberg
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mirror

      - name: Sync main
        run: |
          set -euo pipefail
          previous=$(git ls-remote --refs origin refs/heads/main | cut -f1)
          previous=${previous:-0000000000000000000000000000000000000000}
          git remote add upstream https://codeberg.org/ziglang/translate-c.git
          timeout --kill-after=30s 10m \
            git -c protocol.version=0 fetch --no-tags upstream refs/heads/main
          git push \
            --force-with-lease="refs/heads/main:${previous}" \
            origin FETCH_HEAD:refs/heads/main
          git show --no-patch --format=fuller FETCH_HEAD
